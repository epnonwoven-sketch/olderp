version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: evergreen_app
    restart: always
    ports:
      - "8000:80"
    environment:
      APP_NAME: "${APP_NAME:-EvergreenIndustries}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY:-base64:TJjSCGGM2+D5hg+Vv3hMv2wbYvjgGZ4p2PTwF9CRjFY=}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-https://evergreenindustries.in}"
      
      DB_CONNECTION: "${DB_CONNECTION:-pgsql}"
      DB_HOST: "${DB_HOST:-db}"
      DB_PORT: "${DB_PORT:-5432}"
      DB_DATABASE: "${DB_DATABASE:-db_evergreen}"
      DB_USERNAME: "${DB_USERNAME:-postgres}"
      DB_PASSWORD: "${DB_PASSWORD:-evergreen@db_gaurav}"

      REDIS_HOST: "${REDIS_HOST:-redis}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-null}"
      REDIS_PORT: "${REDIS_PORT:-6379}"

      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-true}"
      LAST_ACTIVITY_NOT_LOG: "true"
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      - db
      - redis

  db:
    image: postgres:15-alpine
    container_name: evergreen_db
    restart: always
    environment:
      POSTGRES_DB: "${DB_DATABASE:-db_evergreen}"
      POSTGRES_USER: "${DB_USERNAME:-postgres}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-evergreen@db_gaurav}"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: evergreen_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  app_storage:
  pgdata:
